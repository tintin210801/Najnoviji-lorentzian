name: Lorentzian Trading Bot

on:
  schedule:
    - cron: '0 8 * * 1-5' # Pokreće se svaki radni dan u 08:00 UTC
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod s repozitorija
        uses: actions/checkout@v4

      - name: Postavi Python okruženje
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instaliraj ovisnosti
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn requests yfinance matplotlib

      - name: Pokreni Trading Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
